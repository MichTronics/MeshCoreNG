[env:Heltec_v3_repeater_observer_mqtt]
extends = Heltec_lora32_v3
board_build.partitions = min_spiffs.csv ; larger app slot for MQTT/TLS/SNMP firmware
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -UESP32_CPU_FREQ
  -D ESP32_CPU_FREQ=240
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"MQTT Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_MQTT_BRIDGE=1
  -D WITH_SNMP=1
;  -D MQTT_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson
  arduino-libraries/NTPClient
  JChristensen/Timezone
  0neblock/SNMP_Agent

; TCP bridge + MQTT observer combined. The TCP bridge owns the WiFi STA connection;
; the MQTT bridge runs alongside in external-WiFi mode (piggybacks on that connection).
; Keep bridge.enabled on so WiFi stays up for the MQTT uplink.
[env:Heltec_v3_repeater_bridge_tcp_mqtt]
extends = Heltec_lora32_v3
board_build.partitions = min_spiffs.csv ; larger app slot for TCP+MQTT/TLS/SNMP firmware
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -UESP32_CPU_FREQ
  -D ESP32_CPU_FREQ=240
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"TCP+MQTT Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_TCP_BRIDGE=1
  -D WITH_MQTT_BRIDGE=1
  -D WITH_SNMP=1
;  -D MQTT_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<helpers/bridges/TCPBridge.cpp>
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson
  arduino-libraries/NTPClient
  JChristensen/Timezone
  0neblock/SNMP_Agent

